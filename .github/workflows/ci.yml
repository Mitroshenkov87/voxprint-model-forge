name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libfontconfig1
      - name: Free disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host ("C: free {0:N1}%" -f (100 * $disk.FreeSpace / $disk.Size))
          $roots = @(
            'C:\Android',
            "$env:ProgramFiles\Android",
            "${env:ProgramFiles(x86)}\Android",
            "$env:ProgramFiles\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\node",
            "$env:AGENT_TOOLSDIRECTORY\Java_Temurin-Hotspot_jdk",
            "$env:AGENT_TOOLSDIRECTORY\PyPy",
            "$env:AGENT_TOOLSDIRECTORY\CodeQL"
          )
          foreach ($path in $roots) {
            if ($path -and (Test-Path -LiteralPath $path)) {
              Write-Host "remove $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Host ("C: free {0:N1}%" -f (100 * $disk.FreeSpace / $disk.Size))
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install vendor/voxprint_common-0.4.1-py3-none-any.whl
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Pytest
        run: python -m pytest
      - name: Docstrings
        run: python -m interrogate src/voxprint_forge
      - name: CLI reference
        run: python -m voxprint_forge.cli_reference --check
      - name: Docs site
        run: python -m mkdocs build --strict
  model-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install voxprint-common
        run: python -m pip install vendor/voxprint_common-0.4.1-py3-none-any.whl
      - name: model-index
        run: python tools/check_model_index.py
