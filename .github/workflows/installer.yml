# Windows setup for VOXPrint AI Model Forge. Free GitHub-hosted runner, no GPU.
# The setup holds the app wheels and uv.exe; Python, torch and the other
# packages are installed on the PC by install.ps1. No model weights.
# Runs on pull requests that touch the installer, on main, and by hand.
# Nothing is published; the setup is a workflow artifact.
name: installer
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
      - "pyproject.toml"
      - "BUILD.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Stage the app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "installer\windows\staging"
          New-Item -ItemType Directory -Force "$stage\wheels" | Out-Null
          # The version line reads BUILD.json from the package folder.
          Copy-Item BUILD.json src\voxprint_forge\BUILD.json
          python -m pip wheel --no-deps --wheel-dir "$stage\wheels" .
          if ($LASTEXITCODE -ne 0) { throw "the app wheel did not build" }
          $common = "vendor\voxprint_common-0.2.5-py3-none-any.whl"
          $want = (Get-Content "$common.sha256").Split(" ")[0].Trim().ToLower()
          if ((Get-FileHash $common -Algorithm SHA256).Hash.ToLower() -ne $want) { throw "voxprint_common wheel sha256 mismatch" }
          Copy-Item $common "$stage\wheels\"
          foreach ($name in @("BUILD.json", "LICENSE", "NOTICE", "README.md")) { Copy-Item $name "$stage\$name" }
          Copy-Item installer\requirements-mivolo.txt "$stage\requirements-mivolo.txt"
          Copy-Item installer\windows\install.ps1 "$stage\install.ps1"
          $zip = Join-Path $env:RUNNER_TEMP "uv.zip"
          curl.exe -fsSL --retry 5 -o $zip "https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-pc-windows-msvc.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c") { throw "uv sha256 mismatch" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "uv") -Force
          Copy-Item (Get-ChildItem (Join-Path $env:RUNNER_TEMP "uv") -Recurse -Filter uv.exe | Select-Object -First 1).FullName "$stage\uv.exe"
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile the setup
        shell: pwsh
        run: |
          $version = (Get-Content -Raw BUILD.json | ConvertFrom-Json).version
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup was not installed" }
          & $iscc "/DAppVersion=$version" "/O$env:GITHUB_WORKSPACE\dist" "installer\windows\voxprint-model-forge.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          "{0:N1} MB" -f ((Get-Item dist\VoxprintModelForgeSetup.exe).Length / 1MB)
      - name: Silent install, check, uninstall
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:ProgramFiles\VOXPrint AI Suite\Model Forge"
          $p = Start-Process dist\VoxprintModelForgeSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$dir\setup-work\install.log") { Get-Content "$dir\setup-work\install.log" -Tail 80 }
            throw "install failed ($($p.ExitCode))"
          }
          foreach ($f in @("venv\Scripts\voxprint-model-forge.exe", "venv\Scripts\voxprint-forge-cli.exe", "venv-mivolo\Scripts\python.exe", "uv.exe", "LICENSE")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          & "$dir\venv\Scripts\voxprint-forge-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the CLI did not start" }
          & "$dir\venv\Scripts\python.exe" -c "from voxprint_forge.lora.backends import mivolo_python; import sys; p = mivolo_python(); print(p); sys.exit(0 if 'venv-mivolo' in p else 1)"
          if ($LASTEXITCODE -ne 0) { throw "the app does not find venv-mivolo" }
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\VOXPrint AI Suite\VOXPrint AI Model Forge.lnk"
          if (-not (Test-Path $menu)) { throw "Start menu shortcut missing" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 2 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 FullName; throw "uninstall left $dir" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/VoxprintModelForgeSetup.exe
          if-no-files-found: error
