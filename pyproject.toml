[project]
name = "voxprint-forge"
version = "0.1.0"
description = "VOXPrint AI Model Forge: prepare, quantize, measure, and card local GGUF models."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{name = "Aleksandr Mitroshenkov"}]
dependencies = [
  "huggingface_hub>=0.26",
  "jinja2>=3.1",
  "torch>=2.5",
  "transformers>=4.57",
  "safetensors>=0.4",
  "accelerate>=1.0",
  "gguf>=0.10",
  # 0.1.* is not on PyPI. Install the v0.1.1 wheel before this editable install.
  "voxprint-common>=0.1.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "pytest-qt>=4.4",
  "PySide6>=6.8",
  "keyring>=25",
  "nvidia-ml-py>=12",
  "interrogate>=1.7",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "diffusers>=0.37.1,<0.38",
  "jsonschema>=4.23",
]
gui = [
  "voxprint-common[ui]>=0.1.1,<0.2",
  "PySide6>=6.8",
  "keyring>=25",
  "nvidia-ml-py>=12",
]

[project.scripts]
forge = "voxprint_forge.cli:main"
forge-gui = "voxprint_forge.gui.__main__:main"
voxprint-forge-cli = "voxprint_forge.cli:main"

[project.gui-scripts]
voxprint-model-forge = "voxprint_forge.gui.__main__:main"

# Display names and install paths. There is no installer in this repo.
# An upgrade moves an older program folder here, updates shortcuts and PATH,
# and leaves %LOCALAPPDATA%\Voxprint and ~/.local/share/voxprint in place.
[tool.voxprint.install]
display-name = "VOXPrint AI Model Forge"
start-menu-folder = "VOXPrint AI Suite"
shortcut-name = "VOXPrint AI Model Forge"
windows-dir = 'C:\Program Files\VOXPrint AI Suite\Model Forge'
linux-dir = "/opt/voxprint-ai-suite/model-forge"
gui-exe = "voxprint-model-forge.exe"
cli-exe = "voxprint-forge-cli.exe"
user-data = '%LOCALAPPDATA%\Voxprint'
linux-data = "~/.local/share/voxprint"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxprint_forge = ["data/**/*", "gui/assets/*", "gui/assets/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
fail-under = 65
exclude = [
  "src/voxprint_forge/diffusion/probe_ablate.py",
  "src/voxprint_forge/diffusion/probe_decide.py",
  "src/voxprint_forge/diffusion/probe_gate.py",
  "src/voxprint_forge/diffusion/probe_hash.py",
  "src/voxprint_forge/diffusion/probe_prompts.py",
  "src/voxprint_forge/diffusion/probe_spec.py",
]
