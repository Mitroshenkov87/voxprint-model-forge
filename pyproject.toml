[project]
name = "voxprint-forge"
version = "0.1.0"
description = "Voxprint AI Model Forge: prepare, quantize, measure, and card local GGUF models."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Aleksandr Mitroshenkov"}]
dependencies = [
  "huggingface_hub>=0.26",
  "jinja2>=3.1",
  "torch>=2.5",
  "transformers>=4.57",
  "safetensors>=0.4",
  "accelerate>=1.0",
  "gguf>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
forge = "voxprint_forge.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxprint_forge = ["data/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
