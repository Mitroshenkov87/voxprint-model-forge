# Synth4 perplexity / KL jobs. Prompt text is not stored here.
# L2 and L3 pin a published F16 GGUF, so those jobs do not reconvert.
# L1 and L4 download safetensors and run convert_hf_to_gguf.py --outtype f16.
# L1's quants are our own ablation (GGUF general.name "Ablated"). L1 reads the removed
# direction back from our Q5_K_M and projects it out of the pinned BF16 before converting
# (reference = "recover-ablation"), so the reference is what the quants were made from.
# L4 is QA of an upstream mirror. The index gap is recorded and nothing is uploaded.
# sha256, when set on a job or a quant, is checked after that file is downloaded.

[defaults]
chunks = 100
ctx = 512
fit_ctx = 8192
kv_cache = "q8_0"
headroom_gb = 3.0
budgets_gb = [16.0, 24.0]

[[jobs]]
id = "L1"
bf16_repo = "t-tech/T-lite-it-2.1"
bf16_revision = "d125c970c553de58fcee3c937d5e4867d4a448d8"
source_format = "safetensors"
reference = "recover-ablation"
ablation_quant = "Q5_K_M"
expect_mtp = false
note = "Our IQ4_XS and Q5_K_M against the pinned T-lite BF16 with our ablation direction (read back from our Q5_K_M) projected out, converted to F16. That is what both were quantised from. The 2026-10-17 run scored them against the un-ablated BF16, so its KL (0.18 for both) was the ablation, not the quantisation."

[[jobs.quants]]
quant = "IQ4_XS"
repo = "Mitroshenkov87/voxprint-t-lite-it-2.1"
revision = "d85d9393"
pattern = "*IQ4_XS*.gguf"
ours = true

[[jobs.quants]]
quant = "Q5_K_M"
repo = "Mitroshenkov87/voxprint-t-lite-it-2.1"
revision = "d85d9393"
pattern = "*Q5_K_M*.gguf"
ours = true

[[jobs]]
id = "L2"
bf16_repo = "paperscarecrow/Gemma-4-31B-it-abliterated"
bf16_revision = "2491ee58472b82a2372d288f982943b9d5e6a82c"
source_format = "gguf"
f16_file = "gemma-4-31b-abliterated-f16.gguf"
expect_mtp = false
note = "This revision's pinned file is already F16 GGUF, so convert_hf_to_gguf.py is not run. Gemma 4 instruct on raw prose has PPL in the thousands at ctx 512, so compare L2 by KL and top-1 only. The tensors checked in this GGUF (including layer 59 attn_output and ffn_down, the ones the author's script changes) are byte-identical to google/gemma-4-31B-it; the ablation is only in the repo's safetensors folder. Recheck google/gemma-4-31b-it Apache-2.0 before publishing; an anonymous listing can miss a gated model."

[[jobs.quants]]
quant = "IQ3_XXS"
repo = "Mitroshenkov87/voxprint-gemma4-31b"
revision = "0d84d5f0"
pattern = "*IQ3_XXS*.gguf"
ours = true

[[jobs.quants]]
quant = "Q4_K_M"
repo = "paperscarecrow/Gemma-4-31B-it-abliterated"
revision = "2491ee58472b82a2372d288f982943b9d5e6a82c"
pattern = "gemma-4-31b-abliterated-Q4_K_M.gguf"
ours = false
sha256 = "380f2f50f441225e669ab1541220985387bf3933573cd2f4f7e667f3790e73a3"

[[jobs]]
id = "L3"
bf16_repo = "huihui-ai/Huihui-Qwen3.6-27B-abliterated-MTP-GGUF"
bf16_revision = "2da8c0432f0a42c25c14cbc99f90028a90d3dcd3"
source_format = "gguf"
f16_file = "Huihui-Qwen3.6-27B-abliterated-ggml-model-f16.gguf"
sha256 = "5edad8e7c1f81d9cfd5f5226ac3a59f24c73a1ad66733221643c611067aa9027"
expect_mtp = true
note = "Reference is the published F16 GGUF our Q3_K_M was quantised from. The job fails if that file has no MTP head."

[[jobs.quants]]
quant = "Q3_K_M"
repo = "Mitroshenkov87/voxprint-huihui-qwen36-27b"
revision = "29771181"
pattern = "*Q3_K_M*.gguf"
ours = true

[[jobs.quants]]
quant = "Q5_K"
repo = "huihui-ai/Huihui-Qwen3.6-27B-abliterated-MTP-GGUF"
revision = "2da8c0432f0a42c25c14cbc99f90028a90d3dcd3"
pattern = "Huihui-Qwen3.6-27B-abliterated-ggml-model-Q5_K.gguf"
ours = false
sha256 = "a4fd0da6216fb8b9a74e25a688a118b001888b704e17f5c851c2bd80f4f5e284"

[[jobs]]
id = "L4"
bf16_repo = "t-tech/T-pro-it-2.1"
bf16_revision = "a677a7c27bb8820c816fbcf578d912acedcf4439"
source_format = "safetensors"
expect_mtp = false
index_gap = "Mitroshenkov87/voxprint-model-index has no entry for voxprint-mirror-t-pro-it-2.1-gguf. This job does not upload that file."
note = "QA of an upstream t-tech Q4_K_M mirror. We did not quantise this file."

[[jobs.quants]]
quant = "Q4_K_M"
repo = "Mitroshenkov87/voxprint-mirror-t-pro-it-2.1-gguf"
revision = "56ca6ce9"
pattern = "*Q4_K_M*.gguf"
ours = false
