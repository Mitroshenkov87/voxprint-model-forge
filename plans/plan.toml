# A100 80GB run. Disabled models stay in this file and are not executed.
# Headroom is 3 GB, so weights + KV must be <= 13 GiB on a 16 GB card and <= 21 GiB on a 24 GB card.

[run]
name = "a100-80gb"
output_dir = "~/forge-out/work"
wall_clock_budget_min = 150
headroom_gb = 3.0
imatrix_chunks = 128
imatrix_ctx = 512
refusal_limit = 4
ppl_chunks = 1
prose_samples = 1
contexts = [8192, 16384]
llama_cpp_tag = "b11476"
llama_cpp_commit = "988190680d5a89fce97de3c20df2c2813731fd61"
artifact_host = ""

[run.estimates_min]
bootstrap_build = 12
huihui-qwen36-27b = 45
gemma4-31b = 48
"t-lite-it-2.1" = 35
"t-pro-it-2.1" = 80

[[models]]
id = "huihui-qwen36-27b"
enabled = true
optional = false
estimate_min = 45
mode = "requant"
repo = "huihui-ai/Huihui-Qwen3.6-27B-abliterated-MTP-GGUF"
revision = "2da8c0432f0a42c25c14cbc99f90028a90d3dcd3"
licence = "apache-2.0"
params_b = 27
base_model = "Qwen/Qwen3.6-27B"
already_abliterated = true
source_format = "gguf"
credits = ["huihui-ai", "Qwen"]
note = "24 GB tier reuses the same-author Q5_K GGUF (filename has no _M; size matches K_M). Q4_K is the fallback if Q5 misses the 21 GiB cap. 16 GB tier is our imatrix quant. Upstream Q3_K is not reused."

[models.arch]
full_layers = 16
full_kv_heads = 4
full_head_dim = 256

