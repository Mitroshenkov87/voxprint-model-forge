# Synth4 original-versus-compressed arms. Prompt text is not stored here.
# Private prompts load at runtime from FORGE_PRIVATE_PROMPTS (a directory).
# fp8-native runs on sm_89 and newer. bf16-dequant stays for weight-only numerics.
# D2 INT4 is skipped on sm_90. Steps and CFG are the model under test.
# Manifest steps and CFG are ignored.

[defaults]
lpips_max = 0.10
clip_drop_max = 0.01
width = 1024
height = 1024
public_seeds = [0, 1]
private_limit = 50
control_scale = 0.75
attention = "sdpa"

[[jobs]]
id = "D1"
kind = "turbo"
steps = 8
guidance = 0.0
prompts = "base"
private_sets = ["vxp_yuna", "vxp_mei"]
reference = "a"
note = "Z-Image-Turbo tiers. Arms c and d are fp8-native. Arm c-dq dequantises the same transformer file. Local arms are skipped when FORGE_FP8_DIR is unset."

[[jobs.arms]]
id = "a"
role = "reference"
repo = "Tongyi-MAI/Z-Image-Turbo"
revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "fp32"
compute = "bf16"
offload = false

[[jobs.arms]]
id = "b"
role = "candidate"
repo = "Mitroshenkov87/voxprint-mirror-z-image-turbo"
revision = "6e19fdd9"
base_repo = "Tongyi-MAI/Z-Image-Turbo"
base_revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "bf16"
compute = "bf16"
offload = false
files = [
  "zimage-turbo-transformer-bf16*",
  "text_encoder/**",
  "vae/**",
  "tokenizer/**",
  "scheduler/**",
  "model_index.json",
]

[[jobs.arms]]
id = "c"
role = "candidate"
local = true
base_repo = "Tongyi-MAI/Z-Image-Turbo"
base_revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "fp8"
compute = "fp8-native"
offload = false
files = ["zimage-turbo-transformer-fp8.safetensors"]

[[jobs.arms]]
id = "c-dq"
role = "candidate"
local = true
base_repo = "Tongyi-MAI/Z-Image-Turbo"
base_revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "fp8"
compute = "bf16-dequant"
offload = false
files = ["zimage-turbo-transformer-fp8.safetensors"]

[[jobs.arms]]
id = "d"
role = "candidate"
local = true
base_repo = "Tongyi-MAI/Z-Image-Turbo"
base_revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "fp8"
compute = "fp8-native"
offload = false
files = ["zimage-turbo-transformer-fp8.safetensors", "qwen3-4b-text-encoder-fp8.safetensors"]

[[jobs]]
id = "D2"
kind = "turbo"
steps = 8
guidance = 0.0
prompts = "base"
private_sets = ["vxp_yuna", "vxp_mei"]
reference = "a"
requires_cc = ["7.5", "8.0", "8.6", "8.9", "12.0"]
note = "Upstream nunchaku-ai INT4 is a measurement-only baseline, not a Voxprint quant. Hopper has no 4-bit tensor cores, so these arms are skipped on sm_90."

[[jobs.arms]]
id = "a"
role = "reference"
repo = "Tongyi-MAI/Z-Image-Turbo"
revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
quant = "bf16"
compute = "bf16"
offload = false
reuse_job = "D1"
reuse_arm = "a"

[[jobs.arms]]
id = "r128"
role = "candidate"
repo = "nunchaku-ai/nunchaku-z-image-turbo"
revision = "ca6bac69c3b0b2bdd31ca5196bf87c5f2a9eaedf"
