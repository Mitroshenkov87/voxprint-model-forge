# Canvas add-on. Three resumable parts, each with its own private upload.
# Minutes are the A100 estimates: base 55, ControlNet 25, Edit 55.

[run]
id = "canvas-zimage-tiers-v1"
min_free_gb = 120

[[parts]]
id = "base"
estimate_min = 55
output_name = "Tongyi-MAI--Z-Image-Turbo-voxprint"
hf_repo = "Mitroshenkov87/voxprint-mirror-z-image-turbo"
kaggle_slug = "voxprint-mirror-z-image-turbo"
min_free_gb = 40

[[parts.sources]]
id = "turbo"
repo = "Tongyi-MAI/Z-Image-Turbo"
revision = "f332072aa78be7aecdf3ee76d5c247082da564a6"
licence = "apache-2.0"

